services:
  - type: web
    name: ems-database-backup-worker
    runtime: docker
    plan: starter
    numInstances: 1
    dockerfilePath: ./backup_worker/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: BACKUP_WORKER_TOKEN
        sync: false
