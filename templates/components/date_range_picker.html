{% macro date_range_picker(id, label, from_value, to_value, from_name='from', to_name='to', required=false, wrapper_class='filter-control', required_message='Select both a start date and an end date.') -%}
<div class="{{ wrapper_class }} date-range-filter"
     data-date-range
     data-date-from="{{ from_value }}"
     data-date-to="{{ to_value }}"
     {% if required %}data-range-required{% endif %}>
    <label id="{{ id }}-label" for="{{ id }}">{{ label }}</label>
    <div class="date-range-control">
        <button class="date-range-trigger"
                id="{{ id }}"
                type="button"
                data-range-toggle
                aria-describedby="{{ id }}-display{% if required %} {{ id }}-error{% endif %}"
                aria-haspopup="dialog"
                aria-expanded="false"
                aria-controls="{{ id }}-calendar">
            <i data-lucide="calendar-days" aria-hidden="true"></i>
            <span id="{{ id }}-display" data-range-display>Choose dates</span>
            <i class="date-range-chevron" data-lucide="chevron-down" aria-hidden="true"></i>
        </button>
        <button class="date-range-clear"
                type="button"
                data-range-clear
                aria-label="Clear date range"
                title="Clear date range"
                hidden>
            <i data-lucide="x" aria-hidden="true"></i>
        </button>
    </div>
    <input type="hidden" name="{{ from_name }}" value="{{ from_value }}" data-range-from>
    <input type="hidden" name="{{ to_name }}" value="{{ to_value }}" data-range-to>
    {% if required %}
    <p class="date-range-error" id="{{ id }}-error" data-range-error role="alert" hidden>
        {{ required_message }}
    </p>
    {% endif %}
    <div class="date-range-popover"
         id="{{ id }}-calendar"
         role="dialog"
         aria-labelledby="{{ id }}-label"
         hidden>
        <div class="date-range-calendar-header">
            <button class="date-range-month-button"
                    type="button"
                    data-range-month-step="-1"
                    aria-label="Previous month">
                <i data-lucide="chevron-left" aria-hidden="true"></i>
            </button>
            <strong data-range-month></strong>
            <button class="date-range-month-button"
                    type="button"
                    data-range-month-step="1"
                    aria-label="Next month">
                <i data-lucide="chevron-right" aria-hidden="true"></i>
            </button>
        </div>
        <p class="date-range-instructions" data-range-instructions aria-live="polite"></p>
        <div class="date-range-weekdays" aria-hidden="true">
            <span>Su</span><span>Mo</span><span>Tu</span><span>We</span>
            <span>Th</span><span>Fr</span><span>Sa</span>
        </div>
        <div class="date-range-days" data-range-days role="grid"></div>
        <button class="date-range-done" type="button" data-range-done hidden>Done</button>
    </div>
</div>
{%- endmacro %}
