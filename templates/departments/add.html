{% extends "base.html" %}

{% block title %}Add Department | CMM EMS{% endblock %}
{% block header_title %}Add Department{% endblock %}

{% block content %}
<div class="page-heading"><h1>Add department</h1><p>Create a department for employee assignments.</p></div>
<section class="panel form-panel">
    <form method="post" class="form-grid">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="form-field"><label for="department_name">Department name</label><input id="department_name" name="department_name" type="text" maxlength="100" value="{{ request.form.get('department_name', '') }}" required></div>
        <div class="form-field"><label for="description">Description</label><input id="description" name="description" type="text" maxlength="255" value="{{ request.form.get('description', '') }}"></div>
        <div class="form-actions">
            <button class="button button-primary" type="submit">Save department</button>
            <a class="button button-secondary" href="{{ url_for('department.department_list') }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
