{% extends "base.html" %}

{% block title %}Add Attendance | MCM EMS{% endblock %}
{% block header_title %}Add Attendance{% endblock %}

{% block content %}
<div class="page-heading"><h1>Add attendance</h1><p>Record an employee's attendance.</p></div>
<section class="panel form-panel">
    <form method="post" class="form-grid">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="form-field">
            <label for="employee_id">Employee</label>
            <select id="employee_id" name="employee_id" required>
                <option value="">Select employee</option>
                {% for employee in employees %}
                <option value="{{ employee.id }}" {% if request.form.get('employee_id', '0')|int == employee.id %}selected{% endif %}>{{ employee.first_name }} {{ employee.last_name }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-field"><label for="attendance_date">Date</label><input id="attendance_date" name="attendance_date" type="date" value="{{ request.form.get('attendance_date', '') }}" required></div>
        <div class="form-field"><label for="time_in">Time in</label><input id="time_in" name="time_in" type="time" value="{{ request.form.get('time_in', '') }}"></div>
        <div class="form-field"><label for="time_out">Time out</label><input id="time_out" name="time_out" type="time" value="{{ request.form.get('time_out', '') }}"></div>
        <div class="form-field">
            <label for="status">Status</label>
            <select id="status" name="status" required>
                {% for status in ('Present', 'Absent', 'Late', 'On Leave') %}
                <option value="{{ status }}" {% if request.form.get('status', 'Present') == status %}selected{% endif %}>{{ status }}</option>
                {% endfor %}
            </select>
        </div>
        <div class="form-actions">
            <button class="button button-primary" type="submit">Save attendance</button>
            <a class="button button-secondary" href="{{ url_for('attendance.attendance_list') }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
