{% extends "base.html" %}

{% block title %}Submit Travel Order | MCM EMS{% endblock %}
{% block header_title %}Submit Travel Order{% endblock %}

{% block content %}
<div class="page-heading page-heading-row">
    <div>
        <h1>Submit Travel Order</h1>
        <p>Provide your travel details for HR or administrator review.</p>
    </div>
    <a class="button button-secondary" href="{{ url_for('travel_order.my_travel_orders') }}">My Travel Orders</a>
</div>
<section class="panel form-panel">
    <form method="post" class="form-grid">
        <input type="hidden" name="_csrf_token" value="{{ csrf_token() }}">
        <div class="form-field payslip-full-width">
            <label for="destination">Destination</label>
            <input id="destination" name="destination" type="text" maxlength="{{ max_destination_length }}" value="{{ request.form.get('destination', '') }}" required>
        </div>
        <div class="form-field payslip-full-width">
            <label for="purpose">Purpose of travel</label>
            <textarea id="purpose" name="purpose" rows="4" maxlength="{{ max_purpose_length }}" required>{{ request.form.get('purpose', '') }}</textarea>
        </div>
        <div class="form-field">
            <label for="departure_date">Departure date</label>
            <input id="departure_date" name="departure_date" type="date" value="{{ request.form.get('departure_date', '') }}" required>
        </div>
        <div class="form-field">
            <label for="return_date">Return date</label>
            <input id="return_date" name="return_date" type="date" value="{{ request.form.get('return_date', '') }}" required>
        </div>
        <div class="form-actions">
            <button class="button button-primary" type="submit">Submit for approval</button>
            <a class="button button-secondary" href="{{ url_for('travel_order.my_travel_orders') }}">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
